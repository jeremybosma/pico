[project]
name = "pico"
version = "1.0.0"
description = "Distill Stockfish into a tiny browser chess model"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mlx>=0.22,<0.30",
  "numpy>=2,<3",
  "chess>=1.11,<2",
]

[project.scripts]
chess-generate = "chess_model.generate:main"
chess-train = "chess_model.train:main"
chess-export = "chess_model.export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chess_model"]
